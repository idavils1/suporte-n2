<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title id="t">Mapa mental do certificado digital (resumo)</title><desc id="d">Centro: certificado digital X.509 v3. Ramos: Identidade (Requerente (Subject), Nome alternativo (SAN), Emissor (Issuer)); Validade (Not Before / Not After, Datas em UTC); Chaves (Chave pública (RSA 2048), Parâmetros (05 00), Pública × privada); Assinatura da AC (Algoritmo (sha256RSA), Hash (SHA-256)); Confiança (Cadeia de certificação, AIA, AKI / SKI, Políticas (OID)); Revogação (CRL e CDP, OCSP); Permissões (Uso da chave (Key Usage), Uso avançado (EKU), Restrições básicas); Identificação (Número de série, Impressão digital, Versão (V3)).</desc>
  <defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b4c9a"/></marker></defs>
  <rect x="0.5" y="0.5" width="759" height="439" rx="14" fill="#ffffff" stroke="#c9b8e6"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#6b4c9a">Mapa mental do certificado digital (resumo)</text>
