<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title id="t">Hierarquia da ICP-Brasil</title><desc id="d">Pirâmide: no topo o Comitê Gestor (normativo); abaixo o ITI, AC Raiz; depois as ACs de 1º e 2º nível; depois as ARs; na base os prestadores PSS, PSC e PSBio.</desc>
  <defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b4c9a"/></marker></defs>
  <rect x="0.5" y="0.5" width="639" height="519" rx="14" fill="#ffffff" stroke="#c9b8e6"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#6b4c9a">Hierarquia da ICP-Brasil</text>
  
  <polygon points="320,56 410,136 230,136" fill="#e4d8f7" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="320" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#111212">CG ICP-Brasil</text>
  <text x="430" y="104" font-size="12" fill="#5a5a5a">Normativo: define políticas e regras</text>
  <polygon points="230,144 410,144 460,214 180,214" fill="#f3eefb" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="320" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#111212">ITI · AC Raiz</text>
  <text x="320" y="196" text-anchor="middle" font-size="11.5" fill="#5a5a5a">executa, credencia, audita e fiscaliza</text>
  <polygon points="180,222 460,222 510,292 130,292" fill="#dbeafe" stroke="#1565c0" stroke-width="1.6"/>
  <text x="320" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#111212">ACs (1º e 2º nível)</text>
  <text x="320" y="274" text-anchor="middle" font-size="11.5" fill="#5a5a5a">emitem, renovam e revogam certificados</text>
  <polygon points="130,300 510,300 560,370 80,370" fill="#dff3e0" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="320" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#111212">ARs · Autoridades de Registro</text>
  <text x="320" y="352" text-anchor="middle" font-size="11.5" fill="#5a5a5a">identificam o titular (presencial, biometria ou videoconferência)</text>
  <rect x="80" y="390" width="480" height="64" rx="10" fill="#fde9d4" stroke="#b45309" stroke-width="1.6"/>
  <text x="320" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#111212">PSS · PSC · PSBio</text>
  <text x="320" y="438" text-anchor="middle" font-size="11.5" fill="#5a5a5a">prestadores de suporte, de confiança (nuvem/HSM) e de biometria</text>
  <text x="24" y="496" font-size="12" fill="#5a5a5a">Base legal: Medida Provisória 2.200-2/2001.</text>
</svg>