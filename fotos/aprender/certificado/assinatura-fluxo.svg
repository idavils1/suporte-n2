<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title id="t">Assinatura digital: assinar e verificar</title><desc id="d">Quem assina: documento, SHA-256, hash, assinatura com a chave privada. Quem verifica: calcula o hash novo do documento recebido, extrai o hash da assinatura com a chave pública e compara. Iguais: válida. Diferentes: inválida.</desc>
  <defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b4c9a"/></marker></defs>
  <rect x="0.5" y="0.5" width="859" height="469" rx="14" fill="#ffffff" stroke="#c9b8e6"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#6b4c9a">Assinatura digital: assinar e verificar</text>
  
  <text x="24" y="70" font-size="13" font-weight="700" fill="#6b4c9a">QUEM ASSINA</text>
  <g><rect x="24" y="84" width="150" height="58" rx="10" fill="#f3eefb" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="99" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#111212">Documento</text>
  <text x="99" y="128" text-anchor="middle" font-size="12" fill="#5a5a5a">PDF, XML…</text></g>
  <g><line x1="174" y1="113" x2="214" y2="113" stroke="#6b4c9a" stroke-width="2" marker-end="url(#ponta)"/>
  </g>
  <g><rect x="218" y="84" width="150" height="58" rx="10" fill="#f3eefb" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="293" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#111212">SHA-256</text>
  <text x="293" y="128" text-anchor="middle" font-size="12" fill="#5a5a5a">função hash</text></g>
  <g><line x1="368" y1="113" x2="408" y2="113" stroke="#6b4c9a" stroke-width="2" marker-end="url(#ponta)"/>
  </g>
  <g><rect x="412" y="84" width="150" height="58" rx="10" fill="#f3eefb" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="487" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#111212">Hash</text>
  <text x="487" y="128" text-anchor="middle" font-size="12" fill="#5a5a5a">64 caracteres hex</text></g>
  <g><line x1="562" y1="113" x2="602" y2="113" stroke="#6b4c9a" stroke-width="2" marker-end="url(#ponta)"/>
  </g>
  <g><rect x="606" y="84" width="230" height="58" rx="10" fill="#e4d8f7" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="721" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#111212">Assinatura</text>
  <text x="721" y="128" text-anchor="middle" font-size="12" fill="#5a5a5a">hash ^ d mod n (chave privada)</text></g>
  <text x="24" y="196" font-size="13" font-weight="700" fill="#6b4c9a">QUEM VERIFICA</text>
  <g><rect x="24" y="210" width="150" height="58" rx="10" fill="#f3eefb" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="99" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#111212">Documento</text>
  <text x="99" y="254" text-anchor="middle" font-size="12" fill="#5a5a5a">o que chegou</text></g>
  <g><line x1="174" y1="239" x2="214" y2="239" stroke="#6b4c9a" stroke-width="2" marker-end="url(#ponta)"/>
  </g>
  <g><rect x="218" y="210" width="150" height="58" rx="10" fill="#f3eefb" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="293" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#111212">SHA-256</text>
  </g>
  <g><line x1="368" y1="239" x2="408" y2="239" stroke="#6b4c9a" stroke-width="2" marker-end="url(#ponta)"/>
  </g>
  <g><rect x="412" y="210" width="150" height="58" rx="10" fill="#f3eefb" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="487" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#111212">Hash novo</text>
  </g>
  <g><rect x="606" y="210" width="230" height="58" rx="10" fill="#dbeafe" stroke="#1565c0" stroke-width="1.6"/>
  <text x="721" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#111212">Hash extraído</text>
  <text x="721" y="254" text-anchor="middle" font-size="12" fill="#5a5a5a">assinatura ^ e mod n (chave pública)</text></g>
  <g><line x1="721" y1="142" x2="721" y2="206" stroke="#6b4c9a" stroke-width="2" marker-end="url(#ponta)"/>
  <text x="729" y="178" font-size="11.5" fill="#5a5a5a">anexada</text></g>
  <g><line x1="487" y1="268" x2="487" y2="318" stroke="#6b4c9a" stroke-width="2" marker-end="url(#ponta)"/>
  </g>
  <g><line x1="721" y1="268" x2="560" y2="330" stroke="#6b4c9a" stroke-width="2" marker-end="url(#ponta)"/>
  </g>
  <g><rect x="330" y="322" width="230" height="52" rx="10" fill="#f3eefb" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="445" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#111212">Comparar</text>
  <text x="445" y="363" text-anchor="middle" font-size="12" fill="#5a5a5a">os dois hashes são iguais?</text></g>
  <g><line x1="400" y1="374" x2="300" y2="404" stroke="#6b4c9a" stroke-width="2" marker-end="url(#ponta)"/>
  </g>
  <g><line x1="490" y1="374" x2="590" y2="404" stroke="#6b4c9a" stroke-width="2" marker-end="url(#ponta)"/>
  </g>
  <g><rect x="120" y="404" width="250" height="46" rx="10" fill="#dff3e0" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="245" y="432" text-anchor="middle" font-size="15" font-weight="700" fill="#111212">Iguais: assinatura VÁLIDA</text>
  </g>
  <g><rect x="520" y="404" width="290" height="46" rx="10" fill="#fde2e1" stroke="#c62828" stroke-width="1.6"/>
  <text x="665" y="432" text-anchor="middle" font-size="15" font-weight="700" fill="#111212">Diferentes: INVÁLIDA</text>
  </g>
</svg>