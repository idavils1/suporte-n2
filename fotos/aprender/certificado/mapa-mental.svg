<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title id="t">Mapa mental do certificado digital</title><desc id="d">Centro: certificado digital X.509 v3. Ramos: Identidade (Requerente (Subject), Nome alternativo (SAN), Emissor (Issuer)); Validade (Not Before / Not After, Datas em UTC); Chaves (Chave pública (RSA 2048), Parâmetros (05 00), Pública × privada); Assinatura da AC (Algoritmo (sha256RSA), Hash (SHA-256)); Confiança (Cadeia de certificação, AIA, AKI / SKI, Políticas (OID)); Revogação (CRL e CDP, OCSP); Permissões (Uso da chave (Key Usage), Uso avançado (EKU), Restrições básicas); Identificação (Número de série, Impressão digital, Versão (V3)).</desc>
  <defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b4c9a"/></marker></defs>
  <rect x="0.5" y="0.5" width="1119" height="719" rx="14" fill="#ffffff" stroke="#c9b8e6"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#6b4c9a">Mapa mental do certificado digital</text>
  <path d="M560 374 Q 560 374 560 144" stroke="#6b4c9a" stroke-width="4" fill="none" opacity="0.55"/><a href="#campo-validade-requerente"><rect x="485" y="127" width="150" height="34" rx="17" fill="#ffffff" stroke="#6b4c9a" stroke-width="2"/>
      <text x="560" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#6b4c9a">Identidade</text></a><a href="#campo-validade-requerente"><text x="560" y="86" text-anchor="middle" font-size="12" fill="#111212" text-decoration="underline">Requerente (Subject)</text></a><a href="#campo-san"><text x="560" y="103" text-anchor="middle" font-size="12" fill="#111212" text-decoration="underline">Nome alternativo (SAN)</text></a><a href="#campo-emissor"><text x="560" y="120" text-anchor="middle" font-size="12" fill="#111212" text-decoration="underline">Emissor (Issuer)</text></a><path d="M560 374 Q 676.6726188957804 374 793.3452377915607 211.3654403270941" stroke="#1565c0" stroke-width="4" fill="none" opacity="0.55"/><a href="#campo-validade-requerente"><rect x="718.3452377915607" y="194.3654403270941" width="150" height="34" rx="17" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
      <text x="793.3452377915607" y="216.3654403270941" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">Validade</text></a><a href="#campo-validade-requerente"><text x="876.3452377915607" y="206.8654403270941" text-anchor="start" font-size="12" fill="#111212" text-decoration="underline">Not Before / Not After</text></a><a href="#utc"><text x="876.3452377915607" y="223.8654403270941" text-anchor="start" font-size="12" fill="#111212" text-decoration="underline">Datas em UTC</text></a><path d="M560 374 Q 725 374 890 374" stroke="#2e7d32" stroke-width="4" fill="none" opacity="0.55"/><a href="#campo-chave-publica"><rect x="815" y="357" width="150" height="34" rx="17" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
      <text x="890" y="379" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">Chaves</text></a><a href="#campo-chave-publica"><text x="973" y="361" text-anchor="start" font-size="12" fill="#111212" text-decoration="underline">Chave pública (RSA 2048)</text></a><a href="#campo-chave-publica"><text x="973" y="378" text-anchor="start" font-size="12" fill="#111212" text-decoration="underline">Parâmetros (05 00)</text></a><a href="#rsa"><text x="973" y="395" text-anchor="start" font-size="12" fill="#111212" text-decoration="underline">Pública × privada</text></a><path d="M560 374 Q 676.6726188957804 374 793.3452377915607 536.6345596729059" stroke="#b45309" stroke-width="4" fill="none" opacity="0.55"/><a href="#campo-algoritmo-assinatura"><rect x="718.3452377915607" y="519.6345596729059" width="150" height="34" rx="17" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
      <text x="793.3452377915607" y="541.6345596729059" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Assinatura da AC</text></a><a href="#campo-algoritmo-assinatura"><text x="876.3452377915607" y="532.1345596729059" text-anchor="start" font-size="12" fill="#111212" text-decoration="underline">Algoritmo (sha256RSA)</text></a><a href="#hash-sha"><text x="876.3452377915607" y="549.1345596729059" text-anchor="start" font-size="12" fill="#111212" text-decoration="underline">Hash (SHA-256)</text></a><path d="M560 374 Q 560 374 560 604" stroke="#6b4c9a" stroke-width="4" fill="none" opacity="0.55"/><a href="#cadeia-certificacao"><rect x="485" y="587" width="150" height="34" rx="17" fill="#ffffff" stroke="#6b4c9a" stroke-width="2"/>
      <text x="560" y="609" text-anchor="middle" font-size="14" font-weight="700" fill="#6b4c9a">Confiança</text></a><a href="#cadeia-certificacao"><text x="560" y="638" text-anchor="middle" font-size="12" fill="#111212" text-decoration="underline">Cadeia de certificação</text></a><a href="#campo-aia"><text x="560" y="655" text-anchor="middle" font-size="12" fill="#111212" text-decoration="underline">AIA</text></a><a href="#campo-identificador-chave"><text x="560" y="672" text-anchor="middle" font-size="12" fill="#111212" text-decoration="underline">AKI / SKI</text></a><a href="#campo-politicas"><text x="560" y="689" text-anchor="middle" font-size="12" fill="#111212" text-decoration="underline">Políticas (OID)</text></a><path d="M560 374 Q 443.3273811042197 374 326.65476220843937 536.6345596729059" stroke="#c62828" stroke-width="4" fill="none" opacity="0.55"/><a href="#campo-cdp"><rect x="251.65476220843937" y="519.6345596729059" width="150" height="34" rx="17" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
      <text x="326.65476220843937" y="541.6345596729059" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">Revogação</text></a><a href="#campo-cdp"><text x="243.65476220843937" y="532.1345596729059" text-anchor="end" font-size="12" fill="#111212" text-decoration="underline">CRL e CDP</text></a><a href="#revogacao"><text x="243.65476220843937" y="549.1345596729059" text-anchor="end" font-size="12" fill="#111212" text-decoration="underline">OCSP</text></a><path d="M560 374 Q 395 374 230 374" stroke="#1565c0" stroke-width="4" fill="none" opacity="0.55"/><a href="#campo-uso-chave"><rect x="155" y="357" width="150" height="34" rx="17" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
      <text x="230" y="379" text-anchor="middle" font-size="14" font-weight="700" fill="#1565c0">Permissões</text></a><a href="#campo-uso-chave"><text x="147" y="361" text-anchor="end" font-size="12" fill="#111212" text-decoration="underline">Uso da chave (Key Usage)</text></a><a href="#campo-uso-avancado"><text x="147" y="378" text-anchor="end" font-size="12" fill="#111212" text-decoration="underline">Uso avançado (EKU)</text></a><a href="#campo-restricoes-basicas"><text x="147" y="395" text-anchor="end" font-size="12" fill="#111212" text-decoration="underline">Restrições básicas</text></a><path d="M560 374 Q 443.3273811042196 374 326.65476220843925 211.3654403270941" stroke="#2e7d32" stroke-width="4" fill="none" opacity="0.55"/><a href="#campo-numero-serie"><rect x="251.65476220843925" y="194.3654403270941" width="150" height="34" rx="17" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
      <text x="326.65476220843925" y="216.3654403270941" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">Identificação</text></a><a href="#campo-numero-serie"><text x="243.65476220843925" y="198.3654403270941" text-anchor="end" font-size="12" fill="#111212" text-decoration="underline">Número de série</text></a><a href="#campo-impressao-digital"><text x="243.65476220843925" y="215.3654403270941" text-anchor="end" font-size="12" fill="#111212" text-decoration="underline">Impressão digital</text></a><a href="#campo-versao"><text x="243.65476220843925" y="232.3654403270941" text-anchor="end" font-size="12" fill="#111212" text-decoration="underline">Versão (V3)</text></a><a href="#anatomia-certificado"><ellipse cx="560" cy="374" rx="112" ry="48" fill="#e4d8f7" stroke="#6b4c9a" stroke-width="2.5"/>
    <text x="560" y="371" text-anchor="middle" font-size="17" font-weight="700" fill="#111212">Certificado digital</text>
    <text x="560" y="391" text-anchor="middle" font-size="12.5" fill="#6b4c9a">padrão X.509 v3</text></a>
</svg>