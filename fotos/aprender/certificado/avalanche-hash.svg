  <text x="24" y="232" font-size="13" fill="#111212">Só um ponto a mais na entrada e 58 dos 64 caracteres mudaram (em vermelho). Os que ficaram iguais (em cinza) coincidem por acaso.</text>
  <text x="24" y="256" font-size="12" fill="#5a5a5a">Por isso qualquer alteração em um documento assinado muda o hash e a assinatura deixa de conferir.</text>
