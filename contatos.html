<script type="module">
  import { $, $$, escapar, normalizar, svg, slug, mostrarAviso, ligarTema, ligarLogin, aoMudarSessao, ehAdmin, sessao,
    registrarAuditoria, criarDialogo, confirmar, abrirSugestao, lerLocal, gravarLocal, partesBrasilia, formatarData,
    baixarArquivo, copiarTexto } from "./comum/base.js";

  /* ============================================================
   *  QUEM EDITA
   *  Administradoras sempre editam. Para liberar outras contas,
   *  inclua o e-mail (minúsculas) aqui E em podeEditarContatos()
   *  no firestore.rules.
   *  CONTATOS_ABERTO = true deixaria qualquer pessoa editar
   *  assinando com o nome (como os cadernos); para isso, troque
   *  também contatosAbertos() no firestore.rules para true.
   * ============================================================ */
  const CONTATOS_EDITORES = [
    // "nome.sobrenome@valid.com",
  ];
  const CONTATOS_ABERTO = false;

  /* ============================================================
   *  DE ONDE VÊM OS CONTATOS
   *  "planilha": cópia da planilha Google em planilha-contatos/ no
   *    Firestore, gravada pelo Apps Script de integracoes/planilha-contatos/
   *    (muda aqui em segundos depois de editar a planilha). Só leitura.
   *  "csv": Plano B, sem Apps Script. Lê as abas publicadas na web
   *    (Arquivo > Compartilhar > Publicar na Web > CSV) a cada 60 s.
   *    Cole os links em CSV_ABAS.
   *  "site": os contatos cadastrados no próprio site (como antes).
   *  PLANILHA_CONTATOS_ID: o mesmo valor de Codigo.gs. Ao converter o

    const ordem = COL[g].opcoes;
    const chaves = [...grupos.keys()].sort((a, b) => (ordem ? ((ordem.indexOf(a) + 1 || 99) - (ordem.indexOf(b) + 1 || 99)) : 0) || a.localeCompare(b, "pt-BR"));
    const linhas = [];
    chaves.forEach((k) => {
      const fechado = estado.gruposFechados.has(k);
      linhas.push({ tipo: "grupo", chave: k, n: grupos.get(k).length, fechado });
      if (!fechado) grupos.get(k).forEach((c) => linhas.push({ tipo: "linha", c }));
    });
    return linhas;
  }

  /* ------------------------------------------------------------
   *  Abas de grupo, sub-áreas e faixa "Hoje"
   * ------------------------------------------------------------ */
  function renderizarAbas() {
    const abas = [{ id: "todos", nome: "Todos" }, ...gruposAtivos()];
    const contar = (id) => (id === "todos" ? estado.contatos.length : id === "plantao" ? estado.contatos.filter((c) => c.grupo === "plantao" || c.plantao).length : estado.contatos.filter((c) => c.grupo === id).length);
    $("#abas-grupo").innerHTML = abas.map((a) => `<button type="button" class="aba-grupo" role="tab" data-aba="${a.id}" aria-selected="${estado.vista.aba === a.id}" tabindex="${estado.vista.aba === a.id ? 0 : -1}">${escapar(a.nome)}<span class="n">${contar(a.id)}</span></button>`).join("");
    const sub = $("#sub-areas");
    sub.hidden = estado.vista.aba !== "parceiras";
    if (!sub.hidden) {
      sub.innerHTML = [`<button type="button" class="chip" data-sub="" aria-pressed="${!estado.vista.subArea}">Todas</button>`,
        ...AREAS_PARCEIRAS.map((a) => `<button type="button" class="chip" data-sub="${escapar(a)}" aria-pressed="${estado.vista.subArea === a}">${escapar(a)}</button>`)].join("");
    }
  }
  $("#abas-grupo").addEventListener("click", (e) => {
    const b = e.target.closest("[data-aba]");
    if (!b) return;
    estado.vista.aba = b.dataset.aba;
    estado.vista.subArea = "";
    salvarVista();
    renderizarTudo();
  });
  $("#abas-grupo").addEventListener("keydown", (e) => {
    if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
    const bs = $$("[data-aba]", $("#abas-grupo"));
    const i = bs.findIndex((b) => b.dataset.aba === estado.vista.aba);
    const n = bs[(i + (e.key === "ArrowRight" ? 1 : -1) + bs.length) % bs.length];
    n.click();
    $(`[data-aba="${n.dataset.aba}"]`).focus();
  });
  $("#sub-areas").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sub]");
    if (!b) return;
    estado.vista.subArea = b.dataset.sub;
    salvarVista();
    renderizarTudo();
  });
  function renderizarFaixaHoje() {
    const ausentes = estado.contatos.filter(ausenteHoje);
    const plantao = estado.contatos.filter((c) => c.plantao && c.status !== "Desligado" && !ausenteHoje(c));
    $("#faixa-hoje").innerHTML = `
      <button type="button" data-especial="ausentes">${svg("i-calendario")}Hoje: <strong>${ausentes.length}</strong> de férias/ausentes</button>
      <button type="button" data-especial="plantao">${svg("i-telefone")}Plantão: <strong>${escapar(plantao.slice(0, 3).map((c) => c.apelido || c.nome).join(", ") || "ninguém marcado")}</strong>${plantao.length > 3 ? ` +${plantao.length - 3}` : ""}</button>`;
  }
  $("#faixa-hoje").addEventListener("click", (e) => {
    const b = e.target.closest("[data-especial]");
    if (b) aplicarVisao(b.dataset.especial === "ausentes" ? "ausentes" : "plantao");
  });

  /* ------------------------------------------------------------
   *  Visões (prontas e salvas por pessoa no navegador)
   * ------------------------------------------------------------ */
  const VISOES_PRONTAS = {
    padrao: { nome: "Todos os contatos", vista: () => ({ ...VISTA_PADRAO(), compacta: estado.vista.compacta, larguras: estado.vista.larguras }) },
    assunto: { nome: "Quem acionar por assunto", vista: () => ({ ...VISTA_PADRAO(), colunas: ["nome", "area", "assuntos", "quando", "quandoNao", "escalonamento", "email", "ramal", "status"], agrupar: "assuntos", larguras: estado.vista.larguras, compacta: estado.vista.compacta }) },
    matriz: { nome: "Matriz de escalonamento", vista: () => ({ ...estado.vista, especial: "matriz" }) },
    ausentes: { nome: "Ausentes hoje", vista: () => ({ ...VISTA_PADRAO(), colunas: ["nome", "area", "status", "ausenteDe", "ausenteAte", "substitutoId", "email"], especial: "ausentes", larguras: estado.vista.larguras, compacta: estado.vista.compacta }) },
    plantao: { nome: "Plantão", vista: () => ({ ...VISTA_PADRAO(), colunas: ["nome", "area", "escala", "celular", "ramal", "email", "teams", "horario"], especial: "plantao", larguras: estado.vista.larguras, compacta: estado.vista.compacta }) }
  };
  function renderizarVisoes() {
    const salvas = lerLocal(CHAVE_VISOES, []);
    $("#visao").innerHTML = `<optgroup label="Visões prontas">${Object.entries(VISOES_PRONTAS).map(([id, v]) => `<option value="${id}"${estado.visao === id ? " selected" : ""}>${escapar(v.nome)}</option>`).join("")}</optgroup>
      ${salvas.length ? `<optgroup label="Minhas visões">${salvas.map((v, i) => `<option value="salva-${i}"${estado.visao === "salva-" + i ? " selected" : ""}>${escapar(v.nome)}</option>`).join("")}</optgroup>` : ""}
      <optgroup label="Ações"><option value="__salvar">Salvar visão atual…</option>${salvas.length ? '<option value="__excluir">Excluir uma visão salva…</option>' : ""}</optgroup>`;
  }
  function aplicarVisao(id) {
    if (VISOES_PRONTAS[id]) estado.vista = VISOES_PRONTAS[id].vista();
    else if (id.startsWith("salva-")) {
      const v = lerLocal(CHAVE_VISOES, [])[Number(id.slice(6))];
      if (v) estado.vista = { ...VISTA_PADRAO(), ...v.vista };
    }
    estado.visao = id;
    estado.vista.colunas = estado.vista.colunas.filter((c) => COL[c]);
    salvarVista();
    renderizarTudo();
  }
  $("#visao").addEventListener("change", async (e) => {
    const v = e.target.value;
    if (v === "__salvar") {
      const d = criarDialogo({ titulo: "Salvar visão", corpo: `<label class="campo"><span class="rotulo">Nome da visão</span><input name="nome" maxlength="40" required></label>
        <p class="apoio">Guarda colunas, ordem, filtros e agrupamento só neste navegador.</p>
        <div class="form-botoes"><button type="button" class="btn btn-secundario" data-fechar>Cancelar</button><button class="btn" type="submit">Salvar</button></div>` });
      d.querySelector("form").addEventListener("submit", (ev) => {
        const nome = ev.target.nome.value.trim();
        if (!nome) { ev.preventDefault(); return; }
        const salvas = lerLocal(CHAVE_VISOES, []);
        const { especial, ...resto } = estado.vista;
        salvas.push({ nome, vista: { ...resto, especial: especial === "matriz" ? "" : especial } });
        gravarLocal(CHAVE_VISOES, salvas.slice(-20));
        estado.visao = "salva-" + (Math.min(salvas.length, 20) - 1);
        mostrarAviso("Visão salva.");
      });
      d.addEventListener("close", renderizarVisoes);
      d.showModal();
      return;
    }
    if (v === "__excluir") {
      const salvas = lerLocal(CHAVE_VISOES, []);
      const d = criarDialogo({ titulo: "Excluir visão salva", corpo: `<div class="opcoes" style="display:grid;gap:6px">${salvas.map((s, i) => `<button type="button" class="btn btn-secundario" data-exc="${i}">${svg("i-lixeira")}${escapar(s.nome)}</button>`).join("")}</div>` });
      d.addEventListener("click", (ev) => {
        const b = ev.target.closest("[data-exc]");
        if (!b) return;
        salvas.splice(Number(b.dataset.exc), 1);
        gravarLocal(CHAVE_VISOES, salvas);
        estado.visao = "padrao";
        d.close();
      });
      d.addEventListener("close", renderizarVisoes);
      d.showModal();
      return;
    }
    aplicarVisao(v);
  });

  /* ------------------------------------------------------------
   *  Renderização: planilha virtualizada, cartões ou matriz
   * ------------------------------------------------------------ */
  const areaDados = $("#area-dados");
  const usarCartoes = () => (estado.vista.cartoes == null ? matchMedia("(max-width: 768px)").matches : estado.vista.cartoes);
  const largura = (col) => Number(estado.vista.larguras[col]) || COL[col].largura;
  const alturaLinha = () => (estado.vista.compacta ? 32 : 40);

  function renderizarTudo() {
    const grupos = gruposAtivos();
    COL.grupo.opcoes = grupos.map((g) => g.id);
    COL.grupo.nomes = grupos.map((g) => g.nome);
    if (estado.vista.aba !== "todos" && !grupos.some((g) => g.id === estado.vista.aba)) estado.vista.aba = "todos";
    renderizarSinc();
    estado.linhas = montarLinhas();
    renderizarAbas();
    renderizarFaixaHoje();
    renderizarVisoes();
    $("#agrupar").value = estado.vista.agrupar || "";
    $("#btn-densidade").setAttribute("aria-pressed", String(!!estado.vista.compacta));
    $("#btn-cartoes").setAttribute("aria-pressed", String(usarCartoes()));
    const n = estado.filtrados.length;
    const filtrosAtivos = Object.values(estado.vista.filtros || {}).some((f) => f && ((f.valores && f.valores.length) || f.texto)) || estado.busca || estado.vista.subArea || estado.vista.especial;
    $("#contagem").textContent = `${n.toLocaleString("pt-BR")} de ${estado.contatos.length.toLocaleString("pt-BR")} contato${estado.contatos.length === 1 ? "" : "s"}`;
    $("#btn-limpar-filtros").disabled = !filtrosAtivos;
    if (estado.vista.especial === "matriz") renderizarMatriz();
    else if (usarCartoes()) renderizarCartoes();
    else renderizarPlanilha();
  }

  function renderizarPlanilha() {
    const cols = estado.vista.colunas;
    const total = cols.reduce((s, c) => s + largura(c), 0) + LARGURA_ACOES;
    let planilha = $("#planilha");
    if (!planilha) {
      areaDados.innerHTML = `<div class="planilha" id="planilha" role="grid" aria-label="Planilha de contatos" tabindex="0">
        <div class="cab-grupos" aria-hidden="true"></div><div class="cab" role="row"></div><div class="corpo" role="rowgroup"></div></div>`;
      planilha = $("#planilha");
      ligarPlanilha(planilha);
    }
    planilha.classList.toggle("compacta", !!estado.vista.compacta);
    planilha.style.setProperty("--colunas", cols.map((c) => largura(c) + "px").join(" ") + ` ${LARGURA_ACOES}px`);
    planilha.style.setProperty("--largura-total", total + "px");
    planilha.setAttribute("aria-rowcount", String(estado.filtrados.length + 1));
    // Grupos de colunas (faixas contínuas)
    const faixas = [];
    cols.forEach((c, i) => {
      const g = COL[c].grupo;
      if (faixas.length && faixas[faixas.length - 1].g === g) faixas[faixas.length - 1].n++;
      else faixas.push({ g, n: 1, primeira: i === 0 });
    });
    $(".cab-grupos", planilha).innerHTML = faixas.map((f) => `<div class="cab-grupo${f.primeira ? " fixa" : ""}" style="grid-column: span ${f.n}">${escapar(GRUPOS_COLUNAS.find((g) => g.id === f.g).nome)}</div>`).join("") + `<div class="cab-grupo col-acoes"></div>`;
    const ord = estado.vista.ordenar || {};
    $(".cab", planilha).innerHTML = cols.map((c, i) => {
      const f = (estado.vista.filtros || {})[c];
      const ativo = f && ((f.valores && f.valores.length) || f.texto);
      const sort = ord.col === c ? (ord.dir > 0 ? "ascending" : "descending") : "none";
      return `<div class="cab-celula${i === 0 ? " fixa" : ""}" role="columnheader" aria-sort="${sort}" data-col="${c}" ${i === 0 ? "" : 'draggable="true"'}>
        <button type="button" class="cab-ordenar" data-ordenar="${c}" title="Ordenar por ${escapar(COL[c].rotulo)}"><span>${escapar(COL[c].rotulo)}</span>${sort !== "none" ? svg(sort === "ascending" ? "i-seta-cima" : "i-seta-baixo") : ""}</button>
        ${COL[c].tipo === "foto" ? "" : `<button type="button" class="cab-filtro${ativo ? " ativo" : ""}" data-filtrar="${c}" aria-label="Filtrar ${escapar(COL[c].rotulo)}">${svg("i-filtro")}</button>`}
        <span class="cab-redim" data-redim="${c}" aria-hidden="true"></span></div>`;
    }).join("") + `<div class="cab-celula col-acoes" role="columnheader">Ações</div>`;
    const corpo = $(".corpo", planilha);
    corpo.style.height = estado.linhas.length * alturaLinha() + "px";
    if (!estado.linhas.length) corpo.innerHTML = `<div class="vazio">${textoVazio()}</div>`;
    estado.ultimoIntervalo = null;
    pintarLinhas(true);
  }

  function pintarLinhas(forcar) {
    const planilha = $("#planilha");
    if (!planilha || !estado.linhas.length) return;
    const h = alturaLinha();
    const topoCorpo = 64;
    const inicio = Math.max(0, Math.floor((planilha.scrollTop - topoCorpo) / h) - 8);
    const fim = Math.min(estado.linhas.length, Math.ceil((planilha.scrollTop + planilha.clientHeight) / h) + 8);
    if (!forcar && estado.ultimoIntervalo && estado.ultimoIntervalo[0] === inicio && estado.ultimoIntervalo[1] === fim) return;
    estado.ultimoIntervalo = [inicio, fim];
    const focoNaGrade = planilha.contains(document.activeElement) && document.activeElement.classList.contains("celula");
    const cols = estado.vista.colunas;
    const editor = podeEditar();
    let html = "";
    for (let i = inicio; i < fim; i++) {
      const l = estado.linhas[i];
      if (l.tipo === "grupo") {
        html += `<div class="linha-grupo${l.fechado ? " fechado" : ""}" style="top:${i * h}px" data-grupo="${escapar(l.chave)}" role="row" aria-expanded="${!l.fechado}"><span class="rot">${svg("i-chevron-baixo")}${escapar(l.chave)} <span class="selo">${l.n}</span></span></div>`;
        continue;
      }
      const c = l.c;
      html += `<div class="linha${c.status === "Desligado" ? " desligado" : ""}${piscando(c.id) ? " piscou" : ""}" style="top:${i * h}px" role="row" aria-rowindex="${i + 2}" data-id="${escapar(c.id)}">` +
        cols.map((col, j) => `<div class="celula${j === 0 ? " fixa" : ""}" role="gridcell" tabindex="-1" data-col="${col}" title="${escapar(valorTexto(c, col)).slice(0, 300)}">${htmlCelula(c, col)}</div>`).join("") +
        `<div class="celula col-acoes">${htmlAcoes(c, editor)}</div></div>`;
    }
    $(".corpo", planilha).innerHTML = html;
    if (estado.celula) {
      const el = celulaEl(estado.celula.id, estado.celula.col);
      if (el) { el.classList.add("ativa"); el.tabIndex = 0; if (focoNaGrade) el.focus({ preventScroll: true }); }
    }
  }
  function htmlAcoes(c, editor) {
    const tel = telUrl(c.celular) || telUrl(c.ramal);
    return `<a class="acao-linha${tel ? "" : " inativa"}" href="${escapar(tel || "#")}" title="Ligar" aria-label="Ligar para ${escapar(c.nome)}">${svg("i-telefone")}</a>
      <a class="acao-linha${c.email ? "" : " inativa"}" href="${c.email ? "mailto:" + escapar(c.email) : "#"}" title="E-mail" aria-label="E-mail para ${escapar(c.nome)}">${svg("i-email")}</a>
      <a class="acao-linha${teamsUrl(c.email) ? "" : " inativa"}" href="${escapar(teamsUrl(c.email) || "#")}" target="_blank" rel="noopener noreferrer" title="Conversar no Teams" aria-label="Teams com ${escapar(c.nome)}">${svg("i-conversa")}</a>
      <button type="button" class="acao-linha" data-acao="copiar" title="Copiar contato" aria-label="Copiar contato">${svg("i-copiar")}</button>
      <button type="button" class="acao-linha" data-acao="vcard" title="Baixar vCard (.vcf)" aria-label="Baixar vCard">${svg("i-cartao")}</button>
      <button type="button" class="acao-linha" data-acao="ficha" title="Ver ficha completa" aria-label="Ver ficha de ${escapar(c.nome)}">${svg("i-olho")}</button>
      ${editor ? `<button type="button" class="acao-linha" data-acao="mais" title="Duplicar ou excluir" aria-label="Mais ações">⋯</button>` : ""}`;
  }
  const celulaEl = (id, col) => $(`.linha[data-id="${CSS.escape(id)}"] .celula[data-col="${col}"]`);

  function ligarPlanilha(planilha) {
    let pedido = 0;
    planilha.addEventListener("scroll", () => { cancelAnimationFrame(pedido); pedido = requestAnimationFrame(() => pintarLinhas(false)); }, { passive: true });
    planilha.addEventListener("click", (e) => {
      const ordenar = e.target.closest("[data-ordenar]");
      if (ordenar) {
        const col = ordenar.dataset.ordenar;
        const o = estado.vista.ordenar || {};
        estado.vista.ordenar = o.col !== col ? { col, dir: 1 } : o.dir === 1 ? { col, dir: -1 } : { col: "", dir: 1 };
        salvarVista(); renderizarTudo(); return;
      }
      const filtrar = e.target.closest("[data-filtrar]");
      if (filtrar) { abrirFiltro(filtrar.dataset.filtrar, filtrar); return; }
      const grupo = e.target.closest("[data-grupo]");
      if (grupo) {
        const k = grupo.dataset.grupo;
        if (estado.gruposFechados.has(k)) estado.gruposFechados.delete(k); else estado.gruposFechados.add(k);
        renderizarTudo(); return;
      }
      const acao = e.target.closest("[data-acao]");
      if (acao) { executarAcao(acao.dataset.acao, porId(acao.closest("[data-id]").dataset.id), acao); return; }
      const cel = e.target.closest(".celula[data-col]");
      if (cel && !e.target.closest("a")) selecionar(cel.closest("[data-id]").dataset.id, cel.dataset.col, true);
    });
    planilha.addEventListener("dblclick", (e) => {
      const cel = e.target.closest(".celula[data-col]");
      if (cel) iniciarEdicao(cel.closest("[data-id]").dataset.id, cel.dataset.col);
    });
    planilha.addEventListener("keydown", teclaPlanilha);
    // Redimensionar colunas
    planilha.addEventListener("pointerdown", (e) => {
      const r = e.target.closest("[data-redim]");
      if (!r) return;
      e.preventDefault();
      const col = r.dataset.redim;
      const x0 = e.clientX, l0 = largura(col);
      const mover = (ev) => { estado.vista.larguras[col] = Math.max(60, Math.min(600, Math.round(l0 + ev.clientX - x0))); renderizarPlanilha(); };
      const soltar = () => { window.removeEventListener("pointermove", mover); window.removeEventListener("pointerup", soltar); salvarVista(); };
      window.addEventListener("pointermove", mover);
      window.addEventListener("pointerup", soltar);
    });
    // Reordenar colunas arrastando o cabeçalho
    let arrastada = null;
    planilha.addEventListener("dragstart", (e) => {
      const cab = e.target.closest(".cab-celula[data-col]");
      if (!cab || e.target.closest("[data-redim]")) return;
      arrastada = cab.dataset.col;
      cab.classList.add("arrastando");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", arrastada);
    });
    planilha.addEventListener("dragover", (e) => {
      const cab = e.target.closest(".cab-celula[data-col]");
      if (!arrastada || !cab || cab.dataset.col === "nome") return;
      e.preventDefault();
      $$(".alvo-soltar", planilha).forEach((x) => x.classList.remove("alvo-soltar"));
      cab.classList.add("alvo-soltar");
    });
    planilha.addEventListener("drop", (e) => {
      const cab = e.target.closest(".cab-celula[data-col]");
      if (!arrastada || !cab || cab.dataset.col === "nome") return;
      e.preventDefault();
      const cols = estado.vista.colunas.filter((c) => c !== arrastada);
      cols.splice(cols.indexOf(cab.dataset.col), 0, arrastada);
      estado.vista.colunas = cols;
      arrastada = null;
      salvarVista(); renderizarPlanilha();
    });
    planilha.addEventListener("dragend", () => { arrastada = null; $$(".arrastando, .alvo-soltar", planilha).forEach((x) => x.classList.remove("arrastando", "alvo-soltar")); });
  }

  function selecionar(id, col, focar) {
    $$(".celula.ativa").forEach((x) => { x.classList.remove("ativa"); x.tabIndex = -1; });
    estado.celula = { id, col };
    const el = celulaEl(id, col);
    if (el) { el.classList.add("ativa"); el.tabIndex = 0; if (focar) el.focus({ preventScroll: false }); }
  }
  function moverSelecao(dLinha, dCol) {
    const linhasDados = estado.linhas.map((l, i) => ({ ...l, i })).filter((l) => l.tipo === "linha");
    if (!linhasDados.length) return;
    const cols = estado.vista.colunas;
    let li = estado.celula ? linhasDados.findIndex((l) => l.c.id === estado.celula.id) : 0;
    let ci = estado.celula ? cols.indexOf(estado.celula.col) : 0;
    li = Math.max(0, Math.min(linhasDados.length - 1, (li < 0 ? 0 : li) + dLinha));
    ci = Math.max(0, Math.min(cols.length - 1, (ci < 0 ? 0 : ci) + dCol));
    const alvo = linhasDados[li];
    const planilha = $("#planilha");
    const h = alturaLinha();
    const y = alvo.i * h;
    if (y < planilha.scrollTop) planilha.scrollTop = y;
    else if (y + h + 64 > planilha.scrollTop + planilha.clientHeight) planilha.scrollTop = y + h + 64 - planilha.clientHeight;
    pintarLinhas(true);
    selecionar(alvo.c.id, cols[ci], true);
  }
  function teclaPlanilha(e) {
    if (estado.editando || e.target.closest(".editor-celula")) return;
    if (!e.target.classList.contains("celula") && e.target.id !== "planilha") return;
    const mapa = { ArrowDown: [1, 0], ArrowUp: [-1, 0], ArrowRight: [0, 1], ArrowLeft: [0, -1], PageDown: [10, 0], PageUp: [-10, 0] };
    if (mapa[e.key]) { e.preventDefault(); moverSelecao(...mapa[e.key]); return; }
    if (e.key === "Enter" && estado.celula) { e.preventDefault(); iniciarEdicao(estado.celula.id, estado.celula.col); return; }
    if (e.key === "Home" && estado.celula) { e.preventDefault(); moverSelecao(0, -99); }
    if (e.key === "End" && estado.celula) { e.preventDefault(); moverSelecao(0, 99); }
  }

  /* Cartões (celular) */
  function renderizarCartoes() {
    const editor = podeEditar();
    let html = "";
    let n = 0;
    for (const l of estado.linhas) {
      if (n >= estado.cartoesLimite) break;
      if (l.tipo === "grupo") { html += `<div class="cartao-grupo" data-grupo="${escapar(l.chave)}" role="button" tabindex="0">${escapar(l.chave)} <span class="selo">${l.n}</span></div>`; continue; }
      const c = l.c;
      n++;
      html += `<article class="cartao-contato${piscando(c.id) ? " piscou" : ""}" data-id="${escapar(c.id)}">
        <div class="topo">${c.foto && RE_FOTO.test(c.foto) ? `<img class="mini-foto" src="${escapar(c.foto)}" alt="">` : svg("i-usuario")}
          <div><div class="nome">${escapar(c.nome)}${c.exemplo ? ' <span class="exemplo">Exemplo — apagar</span>' : ""}</div>
          <div class="linha2">${escapar([c.cargo, c.area].filter(Boolean).join(" · "))}</div></div></div>
        <div class="linha2">${c.status ? `<span class="etq st-${slug(c.status)}">${escapar(c.status)}</span> ` : ""}${(c.assuntos || []).map((a) => `<span class="etq">${escapar(a)}</span>`).join(" ")}</div>
        ${c.email ? `<div class="linha2">${escapar(c.email)}</div>` : ""}
        <div class="acoes-c">${htmlAcoes(c, editor)}</div></article>`;
    }
    const restantes = estado.filtrados.length - n;
    areaDados.innerHTML = estado.linhas.length
      ? `<div class="cartoes">${html}</div>${restantes > 0 ? `<p style="text-align:center;margin-top:12px"><button type="button" class="btn btn-secundario" id="mais-cartoes">Mostrar mais (${restantes})</button></p>` : ""}`
      : `<div class="vazio">${textoVazio()}</div>`;
  }
  areaDados.addEventListener("click", (e) => {
    if (e.target.closest("#mais-cartoes")) { estado.cartoesLimite += 60; renderizarCartoes(); return; }
    if ($("#planilha")) return;
    const acao = e.target.closest("[data-acao]");
    if (acao) { executarAcao(acao.dataset.acao, porId(acao.closest("[data-id]").dataset.id), acao); return; }
    const g = e.target.closest("[data-grupo]");
    if (g) { const k = g.dataset.grupo; if (estado.gruposFechados.has(k)) estado.gruposFechados.delete(k); else estado.gruposFechados.add(k); renderizarTudo(); return; }
    const m = e.target.closest("[data-matriz]");
    if (m) abrirFicha(m.dataset.matriz);
  });

  /* Matriz de escalonamento: Assunto × N1/N2/N3/Gestão/Diretoria */
  function renderizarMatriz() {
    const lista = contatosFiltrados().filter((c) => c.status !== "Desligado");
    const assuntos = [...new Set([...estado.config.assuntos, ...lista.flatMap((c) => c.assuntos || [])])];
    const linhas = assuntos.map((a) => {
      const celulas = ESCALONAMENTO.map((n) => lista.filter((c) => (c.assuntos || []).includes(a) && c.escalonamento === n)
        .map((c) => `<button type="button" data-matriz="${escapar(c.id)}">${escapar(c.apelido || c.nome)}${ausenteHoje(c) ? " (ausente)" : ""}</button>`).join("") || '<span class="apoio">—</span>');
      return `<tr><td>${escapar(a)}</td>${celulas.map((x) => `<td>${x}</td>`).join("")}</tr>`;
    }).join("");
    areaDados.innerHTML = `<div class="matriz"><table><caption class="sr-only">Matriz de escalonamento</caption><thead><tr><th scope="col">Assunto</th>${ESCALONAMENTO.map((n) => `<th scope="col">${n}</th>`).join("")}</tr></thead><tbody>${linhas}</tbody></table></div>`;
  }

  /* ------------------------------------------------------------
   *  Filtro por coluna (popover)
   * ------------------------------------------------------------ */
  let popAtual = null;
  function fecharPop() { if (popAtual) { popAtual.remove(); popAtual = null; } }
  document.addEventListener("pointerdown", (e) => { if (popAtual && !e.target.closest(".pop") && !e.target.closest("[data-filtrar]")) fecharPop(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && popAtual) { fecharPop(); } });
  function abrirFiltro(col, botao) {
    fecharPop();
    const tipo = COL[col].tipo;
    const f = (estado.vista.filtros || {})[col] || {};
    const soLista = ["lista", "etiquetas", "booleano", "pessoa"].includes(tipo);
    const comTexto = !soLista;
    const set = new Set();
    estado.contatos.forEach((c) => { if (tipo === "etiquetas") (c[col] || []).forEach((x) => set.add(x)); else set.add(valorTexto(c, col) || "(vazio)"); });
    const porLista = soLista || (tipo === "texto" && set.size <= 60);
    let valores = [];
    if (porLista) {
      const ordem = COL[col].opcoes && col !== "grupo" ? COL[col].opcoes : null;
      valores = [...set].sort((a, b) => (ordem ? (ordem.indexOf(a) + 1 || 99) - (ordem.indexOf(b) + 1 || 99) : 0) || a.localeCompare(b, "pt-BR"));
    }
    const pop = document.createElement("div");
    pop.className = "pop";
    pop.setAttribute("role", "dialog");
    pop.setAttribute("aria-label", "Filtrar " + COL[col].rotulo);
    pop.innerHTML = `<strong style="font-size:13px">Filtrar: ${escapar(COL[col].rotulo)}</strong>
      ${comTexto ? `<input type="search" placeholder="Contém…" value="${escapar(f.texto || "")}" data-contem>` : ""}
      ${porLista ? `<div class="opcoes">${valores.map((v) => `<label class="check"><input type="checkbox" value="${escapar(v)}"${(f.valores || []).includes(v) ? " checked" : ""}> ${escapar(v)}</label>`).join("") || '<span class="apoio">Sem valores.</span>'}</div>` : ""}
      <div class="form-botoes"><button type="button" class="btn btn-secundario btn-mini" data-pop="limpar">Limpar</button><button type="button" class="btn btn-mini" data-pop="aplicar">Aplicar</button></div>`;
    document.body.appendChild(pop);
    const r = botao.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(innerWidth - 270, r.left - 200)) + "px";
    pop.style.top = Math.min(innerHeight - 200, r.bottom + 6) + "px";
    popAtual = pop;
    const entrada = pop.querySelector("input");
    if (entrada) entrada.focus();
    const aplicar = (limpar) => {
      estado.vista.filtros = estado.vista.filtros || {};
      if (limpar) delete estado.vista.filtros[col];
      else estado.vista.filtros[col] = { valores: $$("input[type=checkbox]:checked", pop).map((i) => i.value), texto: comTexto ? pop.querySelector("[data-contem]").value.trim() : "" };
      fecharPop(); salvarVista(); renderizarTudo();
    };
    pop.addEventListener("click", (e) => { const b = e.target.closest("[data-pop]"); if (b) aplicar(b.dataset.pop === "limpar"); });
    pop.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("[data-contem]")) { e.preventDefault(); aplicar(false); } });
  }

  /* ------------------------------------------------------------
   *  Barra: busca, agrupar, limpar, colunas, densidade, cartões
   * ------------------------------------------------------------ */
  let temporizadorBusca = 0;
  $("#busca").addEventListener("input", (e) => { clearTimeout(temporizadorBusca); temporizadorBusca = setTimeout(() => { estado.busca = e.target.value; renderizarTudo(); }, 120); });
  $("#agrupar").addEventListener("change", (e) => { estado.vista.agrupar = e.target.value; estado.gruposFechados.clear(); if (estado.vista.especial === "matriz") estado.vista.especial = ""; salvarVista(); renderizarTudo(); });
  $("#btn-limpar-filtros").innerHTML = svg("i-fechar") + "Limpar filtros";
  $("#btn-limpar-filtros").addEventListener("click", () => {
    estado.vista.filtros = {}; estado.vista.subArea = ""; estado.vista.especial = ""; estado.busca = ""; $("#busca").value = "";
    if (["ausentes", "plantao", "matriz"].includes(estado.visao)) estado.visao = "padrao";
    salvarVista(); renderizarTudo();
  });
  $("#btn-colunas").innerHTML = svg("i-colunas");
  $("#btn-densidade").innerHTML = svg("i-tabela");
  $("#btn-cartoes").innerHTML = svg("i-grade");
  $("#btn-csv").innerHTML = svg("i-download");
  $("#btn-imprimir").innerHTML = svg("i-imprimir");
  $("#btn-adicionar").innerHTML = svg("i-mais") + "Adicionar";
  $("#btn-importar").innerHTML = svg("i-upload") + "Importar / colar do Excel";
  $("#btn-desfazer").innerHTML = svg("i-desfazer");
  $("#btn-apagar-exemplos").innerHTML = svg("i-lixeira") + "Apagar exemplos";
  $("#btn-densidade").addEventListener("click", () => { estado.vista.compacta = !estado.vista.compacta; salvarVista(); renderizarTudo(); });
  $("#btn-cartoes").addEventListener("click", () => { estado.vista.cartoes = !usarCartoes(); salvarVista(); renderizarTudo(); });
  $("#btn-colunas").addEventListener("click", () => {
    const vis = new Set(estado.vista.colunas);
    const d = criarDialogo({
      titulo: "Colunas",
      corpo: `<div class="colunas-escolha">${GRUPOS_COLUNAS.map((g) => {
        const cols = COLUNAS.filter((c) => c.grupo === g.id);
        return `<fieldset><legend><label class="check"><input type="checkbox" data-grupo-col="${g.id}"${cols.every((c) => vis.has(c.id)) ? " checked" : ""}> ${escapar(g.nome)}</label></legend>
          ${cols.map((c) => `<label class="check"><input type="checkbox" data-col-vis="${c.id}"${vis.has(c.id) ? " checked" : ""}${c.id === "nome" ? " disabled" : ""}> ${escapar(c.rotulo)}</label>`).join("")}</fieldset>`;
      }).join("")}</div>
      <div class="form-botoes"><button type="button" class="btn btn-secundario" data-col-padrao>Voltar ao padrão</button><button type="submit" class="btn">Aplicar</button></div>`
    });
    d.addEventListener("change", (e) => {
      const g = e.target.dataset.grupoCol;
      if (g) $$(`[data-col-vis]`, d).forEach((i) => { if (COL[i.dataset.colVis].grupo === g && i.dataset.colVis !== "nome") i.checked = e.target.checked; });
    });
    d.querySelector("[data-col-padrao]").addEventListener("click", () => { $$("[data-col-vis]", d).forEach((i) => { i.checked = colunasIniciais().includes(i.dataset.colVis); }); });
    d.querySelector("form").addEventListener("submit", () => {
      const marcadas = new Set($$("[data-col-vis]:checked", d).map((i) => i.dataset.colVis));
      marcadas.add("nome");
      const atuais = estado.vista.colunas.filter((c) => marcadas.has(c));
      COLUNAS.forEach((c) => { if (marcadas.has(c.id) && !atuais.includes(c.id)) atuais.push(c.id); });
      estado.vista.colunas = atuais;
      salvarVista(); renderizarTudo();

    d.showModal();

  /* Exportar CSV (linhas filtradas, colunas visíveis) e imprimir */
  const colunasExportaveis = () => estado.vista.colunas.filter((c) => COL[c].tipo !== "foto");
  function csvCampo(t) { const s = String(t == null ? "" : t); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
  $("#btn-csv").addEventListener("click", () => {
    const cols = colunasExportaveis();
    const linhas = [cols.map((c) => csvCampo(COL[c].rotulo)).join(";"), ...contatosFiltrados().map((c) => cols.map((col) => csvCampo(valorTexto(c, col))).join(";"))];
    const p = partesBrasilia();
    baixarArquivo(`contatos-${p.ano}-${p.mes}-${p.dia}.csv`, "\ufeff" + linhas.join("\r\n"), "text/csv;charset=utf-8");

  $("#btn-imprimir").addEventListener("click", () => {

    $("#tabela-impressao").innerHTML = `<h1 style="font-size:14pt;margin-bottom:6px">Contatos · ${escapar(formatarData(new Date(), true))}</h1><table><thead><tr>${cols.map((c) => `<th>${escapar(COL[c].rotulo)}</th>`).join("")}</tr></thead>
      <tbody>${contatosFiltrados().map((c) => `<tr>${cols.map((col) => `<td>${escapar(valorTexto(c, col))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    window.print();
  });

  /* ------------------------------------------------------------
   *  Ações da linha: copiar, vCard, ficha, duplicar, excluir
   * ------------------------------------------------------------ */
  function textoContato(c) {
    return [c.nome, c.cargo, [c.area, c.equipe].filter(Boolean).join(" · "), c.email && "E-mail: " + c.email, c.ramal && "Telefone/ramal: " + c.ramal, c.celular && "Celular corporativo: " + c.celular, c.horario && "Horário: " + c.horario].filter(Boolean).join("\n");
  }
  function vcard(c) {
    const esc = (t) => String(t || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/[,;]/g, (m) => "\\" + m);
    const partes = String(c.nome || "").trim().split(/\s+/);
    const sobrenome = partes.length > 1 ? partes.pop() : "";
    return ["BEGIN:VCARD", "VERSION:3.0", `N:${esc(sobrenome)};${esc(partes.join(" "))};;;`, `FN:${esc(c.nome)}`,
      c.empresa || c.area ? `ORG:${esc(c.empresa || "")}${c.area ? ";" + esc(c.area) : ""}` : "", c.cargo ? `TITLE:${esc(c.cargo)}` : "",
      c.email ? `EMAIL;TYPE=INTERNET,WORK:${esc(c.email)}` : "", c.ramal ? `TEL;TYPE=WORK,VOICE:${esc(c.ramal)}` : "", c.celular ? `TEL;TYPE=WORK,CELL:${esc(c.celular)}` : "",
      "END:VCARD"].filter(Boolean).join("\r\n");
  }
  async function executarAcao(acao, c, botao) {
    if (!c) return;
    if (acao === "copiar") { mostrarAviso((await copiarTexto(textoContato(c))) ? "Contato copiado." : "Não foi possível copiar."); }
    else if (acao === "vcard") baixarArquivo(`${slug(c.nome || "contato")}.vcf`, vcard(c), "text/vcard;charset=utf-8");
    else if (acao === "ficha") abrirFicha(c.id);
    else if (acao === "mais") {
      fecharPop();
      const pop = document.createElement("div");
      pop.className = "pop";
      pop.style.width = "200px";
      pop.innerHTML = `<button type="button" class="btn btn-secundario btn-mini" data-m="duplicar">${svg("i-duplicar")}Duplicar linha</button>
        <button type="button" class="btn btn-secundario btn-mini" data-m="editar">${svg("i-lapis")}Editar na ficha</button>
        <button type="button" class="btn btn-perigo btn-mini" data-m="excluir">${svg("i-lixeira")}Excluir linha</button>`;
      document.body.appendChild(pop);
      const r = botao.getBoundingClientRect();
      pop.style.left = Math.max(8, r.right - 200) + "px";
      pop.style.top = Math.min(innerHeight - 150, r.bottom + 4) + "px";
      popAtual = pop;
      pop.addEventListener("click", (e) => {
        const b = e.target.closest("[data-m]");
        if (!b) return;
        fecharPop();
        if (b.dataset.m === "duplicar") duplicar(c);
        if (b.dataset.m === "editar") abrirFicha(c.id, true);
        if (b.dataset.m === "excluir") excluir(c);
      });
      pop.querySelector("button").focus();
    }
  }

  /* ------------------------------------------------------------
   *  Validação e gravação
   * ------------------------------------------------------------ */
  function formatarTelefone(t) {
    const bruto = String(t || "").trim();
    if (!bruto) return { ok: true, valor: "" };
    let d = bruto.replace(/\D/g, "");
    const ramal = /ramal|r\.|ext/i.test(bruto) ? (/(?:ramal|r\.|ext\.?)\s*(\d{2,6})/i.exec(bruto) || [])[1] : "";
    if (ramal) d = d.slice(0, d.length - ramal.length);
    if (d.length >= 12 && d.startsWith("55")) d = d.slice(2);
    let valor;
    if (!d && ramal) valor = "Ramal " + ramal;
    else if (d.length >= 2 && d.length <= 6 && !ramal) valor = "Ramal " + d;
    else if (d.length === 10) valor = `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    else if (d.length === 11) valor = `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
    else if (d.length === 8 || d.length === 4 + 4) valor = `${d.slice(0, 4)}-${d.slice(4)}`;
    else if (/^0?800\d{7}$/.test(d)) valor = `0800 ${d.slice(-7, -4)} ${d.slice(-4)}`;
    else return { ok: false, erro: "Telefone inválido. Use (11) 0000-0000, (11) 90000-0000 ou só o ramal." };
    return { ok: true, valor: ramal && d ? `${valor} ramal ${ramal}` : valor };
  }
  function validarCampo(col, bruto, contato) {
    const def = COL[col];
    let v = bruto;
    switch (def.tipo) {
      case "texto": case "textoLongo": v = String(v || "").trim().slice(0, def.max); if (col === "nome" && !v) return { ok: false, erro: "O nome é obrigatório." }; return { ok: true, valor: v };
      case "email": v = String(v || "").trim().toLowerCase(); if (v && !RE_EMAIL.test(v)) return { ok: false, erro: "E-mail inválido." }; return { ok: true, valor: v.slice(0, 120) };
      case "telefone": return formatarTelefone(v);
      case "link": v = String(v || "").trim(); if (v && !/^https:\/\/[^\s"'<>]+$/i.test(v)) return { ok: false, erro: "Use um link que comece com https://" }; return { ok: true, valor: v.slice(0, 300) };
      case "lista": v = String(v || ""); if (v && !def.opcoes.includes(v)) { const achado = def.opcoes.find((o, i) => normalizar(o) === normalizar(v) || (def.nomes && normalizar(def.nomes[i]) === normalizar(v))); if (!achado) return { ok: false, erro: "Escolha um valor da lista." }; v = achado; } return { ok: true, valor: v };
      case "etiquetas": v = (Array.isArray(v) ? v : String(v || "").split(/[,;|]/)).map((x) => String(x).trim().slice(0, 40)).filter(Boolean); return { ok: true, valor: [...new Set(v)].slice(0, 20) };
      case "booleano": return { ok: true, valor: v === true || /^(sim|s|true|1|x)$/i.test(String(v).trim()) };
      case "data": {
        v = String(v || "").trim();
        if (!v) return { ok: true, valor: "" };
        const br = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v);
        if (br) v = `${br[3]}-${br[2]}-${br[1]}`;
        if (!RE_DATA.test(v) || isNaN(new Date(v + "T12:00:00"))) return { ok: false, erro: "Data inválida (dd/mm/aaaa)." };
        const de = col === "ausenteAte" ? contato && contato.ausenteDe : null;
        if (de && v < de) return { ok: false, erro: "“Ausente até” não pode ser antes de “Ausente de”." };
        return { ok: true, valor: v };
      }
      case "pessoa": v = String(v || ""); if (v && (!porId(v) || (contato && v === contato.id))) return { ok: false, erro: "Escolha uma pessoa da planilha." }; return { ok: true, valor: v };
      case "foto": v = String(v || ""); if (v && (!RE_FOTO.test(v) || v.length > 40000)) return { ok: false, erro: "Foto inválida." }; return { ok: true, valor: v };
      default: return { ok: true, valor: v };
    }
  }
  function contatoVazio() {
    const d = {};
    CAMPOS_GRAVADOS.forEach((k) => { const t = COL[k].tipo; d[k] = t === "etiquetas" ? [] : t === "booleano" ? false : ""; });
    d.status = "Ativo";
    d.exemplo = false;
    return d;
  }
  function dadosParaGravar(c) {
    const d = contatoVazio();
    CAMPOS_GRAVADOS.forEach((k) => { if (c[k] !== undefined) { const r = validarCampo(k, c[k], c); if (r.ok) d[k] = r.valor; } });
    d.exemplo = !!c.exemplo;
    return d;
  }
  const assinatura = () => ({ atualizadoEm: "__AGORA__", atualizadoPor: sessao.email || "" });
  async function gravar(acao, fn, resumo) {
    if (!podeEditar()) { mostrarAviso("Só quem tem permissão pode editar. Use “Sugerir correção”."); return false; }
    try {
      await fn();
      if (acao) { estado.desfazer.push(acao); if (estado.desfazer.length > 30) estado.desfazer.shift(); }
      if (resumo) registrarAuditoria({ acao: resumo.acao, alvo: "contatos", resumo: resumo.texto, detalhes: resumo.detalhes || "" });
      atualizarBotoes();
      return true;
    } catch (e) {
      console.error(e);
      mostrarAviso("Não foi possível salvar. Verifique sua conexão e permissão.");
      return false;
    }
  }
  async function salvarCampo(id, col, valor) {
    const c = porId(id);
    if (!c) return false;
    const antes = c[col];
    if (JSON.stringify(antes ?? "") === JSON.stringify(valor ?? "")) return true;
    return gravar({ tipo: "editar", id, col, antes }, () => estado.api.salvarDoc(`contatos/${id}`, { [col]: valor, ...assinatura() }, true),
      { acao: "editar", texto: `Editou ${COL[col].rotulo} de ${c.nome}`.slice(0, 200), detalhes: id });
  }
  async function criarContato(dados, resumo = true) {
    const id = estado.api.novoId("contatos");
    const ok = await gravar({ tipo: "criar", id }, () => estado.api.salvarDoc(`contatos/${id}`, { ...dadosParaGravar(dados), criadoEm: "__AGORA__", ...assinatura() }),
      resumo ? { acao: "criar", texto: `Adicionou o contato ${dados.nome}`.slice(0, 200), detalhes: id } : null);
    return ok ? id : null;
  }
  async function duplicar(c) {
    const copia = { ...c, nome: "Cópia de " + c.nome, email: "", celular: "", ramal: "", foto: "", exemplo: false };
    const id = await criarContato(copia);
    if (id) { mostrarAviso("Linha duplicada."); setTimeout(() => irPara(id, "nome", true), 300); }
  }
  async function excluir(c) {
    if (!(await confirmar(`Excluir “${c.nome}” da planilha? Dá para desfazer logo em seguida.`, { titulo: "Excluir linha", botao: "Excluir", perigo: true }))) return;
    const dados = dadosParaGravar(c);
    const ok = await gravar({ tipo: "excluir", id: c.id, dados }, () => estado.api.excluirDoc(`contatos/${c.id}`), { acao: "excluir", texto: `Excluiu o contato ${c.nome}`.slice(0, 200), detalhes: c.id });
    if (ok) { fecharFicha(); mostrarAviso("Linha excluída. Use Desfazer se foi sem querer."); }
  }
  async function desfazer() {
    const a = estado.desfazer.pop();
    if (!a) { mostrarAviso("Nada para desfazer."); return; }
    try {

        const lado = 96;
        const cv = document.createElement("canvas");
        cv.width = lado; cv.height = lado;
        const menor = Math.min(img.width, img.height);
        cv.getContext("2d").drawImage(img, (img.width - menor) / 2, (img.height - menor) / 2, menor, menor, 0, 0, lado, lado);
        URL.revokeObjectURL(url);
        resolver(cv.toDataURL("image/jpeg", 0.8));

    });

  function lerTabelaTexto(texto) {
    const t = String(texto || "").replace(/^\ufeff/, "");
    const primeira = t.split(/\r?\n/)[0] || "";
    const sep = primeira.includes("\t") ? "\t" : (primeira.split(";").length >= primeira.split(",").length ? ";" : ",");
    const linhas = [];
    let linha = [], campo = "", aspas = false;
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (aspas) {
        if (ch === '"' && t[i + 1] === '"') { campo += '"'; i++; }
        else if (ch === '"') aspas = false;
        else campo += ch;
      } else if (ch === '"' && campo === "") aspas = true;
      else if (ch === sep) { linha.push(campo); campo = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && t[i + 1] === "\n") i++;
        linha.push(campo); campo = "";
        if (linha.some((x) => x.trim())) linhas.push(linha);
        linha = [];
      } else campo += ch;
    }
    linha.push(campo);
    if (linha.some((x) => x.trim())) linhas.push(linha);
    return linhas;
  }

    form.arquivo.addEventListener("change", async () => {
      const f = form.arquivo.files[0];
      if (!f) return;

      let texto = await f.text();
      if (texto.includes("\ufffd")) { try { texto = new TextDecoder("windows-1252").decode(await f.arrayBuffer()); } catch (e) {} }
      tabela = lerTabelaTexto(texto);
      conferir();
    });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const cab = form.cabecalho.checked;
      const dados = cab ? tabela.slice(1) : tabela;
      const mapa = $$("[data-mapa]", d).map((s) => s.value);
      if (!mapa.includes("nome")) { $("#import-erro", d).textContent = "Indique qual coluna é o “Nome completo”."; return; }
      if (dados.length > 3000) { $("#import-erro", d).textContent = "Importe no máximo 3.000 linhas por vez."; return; }
      const ops = [], ids = [];
      let avisos = 0;
      dados.forEach((linha) => {
        const c = {};
        mapa.forEach((k, i) => {
          if (!k) return;
          const r = validarCampo(k, linha[i] ?? "", c);
          if (r.ok) c[k] = r.valor; else avisos++;
        });
        if (!c.nome) return;
        const id = estado.api.novoId("contatos");
        ids.push(id);
        ops.push({ op: "set", caminho: `contatos/${id}`, dados: { ...dadosParaGravar(c), criadoEm: "__AGORA__", ...assinatura() } });
      });
      if (!ops.length) { $("#import-erro", d).textContent = "Nenhuma linha com nome para importar."; return; }
      $("#import-ok", d).disabled = true;
      const ok = await gravar({ tipo: "importar", ids }, () => estado.api.lote(ops), { acao: "importar", texto: `Importou ${ops.length} contato(s)` });
      if (ok) { d.close(); mostrarAviso(`${ops.length} contato(s) importado(s).${avisos ? ` ${avisos} valor(es) inválido(s) ficaram em branco.` : ""}`, { ms: 6000 }); }
      else $("#import-ok", d).disabled = false;
    });
    d.showModal();
    form.colado.focus();
  });

  /* Apagar exemplos (administradoras) */

  aoMudarSessao(() => { aplicarContatosNuvem(); garantirExemplos(); verAvisoLgpdPlanilha(); });
  async function garantirExemplos() {

  function aplicarContatosNuvem() {
    if (daPlanilha()) { aplicarPlanilha(); return; }
    const nuvem = estado.contatosNuvem || [];
    estado.usandoReserva = !nuvem.length && !estado.config.semExemplos;

  /* ------------------------------------------------------------
   *  Planilha Google (ORIGEM_CONTATOS = "planilha" ou "csv")
   *  Firestore: planilha-contatos/_estado (abas e situação),
   *  planilha-contatos/{aba} (cabeçalhos) e .../{aba}/partes/{n} (linhas).
   *  Uma aba só é trocada quando todas as partes têm o mesmo hash
   *  do documento da aba (evita mostrar meia gravação).
   * ------------------------------------------------------------ */
  const RE_ID_ABA = /^[a-z0-9-]{1,60}$/;
  const RE_ID_PLANILHA = /^[\w-]{20,100}$/;
  const RE_COLUNA_SUSPEITA = /cpf|\brg\b|identidade|nascimento|anivers|endere[cç]o|residencia|residência|pessoal|particular|sa[uú]de|m[eé]dic|sal[aá]rio|banc[aáo]|\bpis\b|\bcnh\b/i;
  function minutosDesde(iso) { const t = new Date(iso).getTime(); return isNaN(t) ? Infinity : (Date.now() - t) / 60000; }
  function haQuanto(iso) {
    const m = minutosDesde(iso);
    if (!isFinite(m)) return "";
    if (m < 1) return "agora há pouco";
    if (m < 60) return `há ${Math.floor(m)} min`;
    return `em ${formatarData(iso, true)}`;
  }
  function piscando(id) {
    const ate = estado.piscar.get(id);
    if (!ate) return false;
    if (ate < Date.now()) { estado.piscar.delete(id); return false; }
    return true;
  }
  function textoVazio() {
    if (estado.contatos.length) return "Nenhum contato com esses filtros.";
    if (!daPlanilha()) return "Nenhum contato cadastrado ainda.";
    if (estado.planilha.falhou) return "Não foi possível carregar a planilha Google agora. Tente de novo em instantes.";
    return estado.planilha.recebeu ? "A planilha Google ainda não tem contatos." : "Carregando os contatos da planilha Google…";
  }

  function mapaCabecalhos(cabecalhos) {
    const usados = new Set();
    const mapa = cabecalhos.map((t) => {
      const rotulo = String(t || "").trim().slice(0, 60);
      const k = adivinharColuna(rotulo);
      if (k && k !== "grupo" && !usados.has(k)) { usados.add(k); return { campo: k }; }
      let id = "x-" + slug(rotulo || "coluna", 40), n = 2;
      while (usados.has(id)) id = `x-${slug(rotulo || "coluna", 36)}-${n++}`;
      usados.add(id);
      return { campo: id, rotulo: rotulo || "Coluna", extra: true };
    });
    if (mapa.length && !usados.has("nome")) mapa[0] = { campo: "nome" };
    return mapa;
  }
  function valorDaPlanilha(campo, bruto) {
    const v = String(bruto == null ? "" : bruto).trim();
    const col = COL[campo];
    if (!v || !col) return v;
    switch (col.tipo) {
      case "etiquetas": return v.split(/[;,\n]/).map((x) => x.trim().slice(0, 60)).filter(Boolean).slice(0, 20);
      case "booleano": return /^(sim|s|x|ok|true|verdadeiro|1|yes)$/i.test(v);
      case "data": { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(v); return m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : RE_DATA.test(v) ? v : ""; }
      case "email": return v.toLowerCase().slice(0, 120);
      case "link": return /^https:\/\/[^\s"<>]+$/i.test(v) ? v.slice(0, 300) : "";
      case "lista": return (col.opcoes || []).find((o) => normalizar(o) === normalizar(v)) || v.slice(0, 100);
      default: return v.slice(0, col.max || 500);
    }
  }
  /* abas: [{ id, nome, ordem, gid, cabecalhos, atualizadoEm, linhas: [{ n, v: [...] }] }] */
  function converterPlanilha(abas) {
    const extras = new Map(), contatos = [], ids = new Set(), colunas = ["nome"];
    abas.forEach((aba) => {
      const mapa = mapaCabecalhos(aba.cabecalhos || []);
      mapa.forEach((m) => {
        if (m.extra && !extras.has(m.campo)) extras.set(m.campo, m.rotulo);
        if (!colunas.includes(m.campo)) colunas.push(m.campo);
      });
      (aba.linhas || []).forEach((l) => {
        const c = { grupo: aba.id, planilha: true, linhaPlanilha: Number(l.n) || 0, atualizadoEm: aba.atualizadoEm || "", atualizadoPor: "Planilha Google" };
        mapa.forEach((m, i) => {
          const v = Array.isArray(l.v) ? l.v[i] : "";
          if (v == null || String(v).trim() === "") return;
          c[m.campo] = m.extra ? String(v).trim().slice(0, 1000) : valorDaPlanilha(m.campo, v);
        });
        if (!c.nome) c.nome = mapa.map((m) => c[m.campo]).find((x) => typeof x === "string" && x) || `Linha ${c.linhaPlanilha}`;
        const base = `${aba.id}-${slug(c.email || c.nome, 40)}`;
        let id = base, n = 2;
        while (ids.has(id)) id = `${base}-${n++}`;
        ids.add(id);
        c.id = id;
        contatos.push(c);
      });
    });
    const iEmail = colunas.indexOf("email");
    if (iEmail >= 0) colunas.splice(iEmail + 1, 0, "teams");
    return { contatos, extras: [...extras].map(([id, rotulo]) => ({ id, rotulo })), colunas };
  }
  const assinaturaContato = (c) => JSON.stringify(Object.entries(c).filter(([k]) => !["atualizadoEm", "_busca"].includes(k)).sort());

  /* Recalcula os contatos a partir das abas recebidas e mostra (se a origem for a planilha) */
  function receberAbas(abas, sinc) {
    const conv = converterPlanilha(abas);
    registrarExtras(conv.extras);
    const atuais = new Set(conv.extras.map((x) => x.id));
    for (let i = IDS_EXTRAS.length - 1; i >= 0; i--) {
      const id = IDS_EXTRAS[i];
      if (atuais.has(id)) continue;
      IDS_EXTRAS.splice(i, 1);
      COLUNAS.splice(COLUNAS.findIndex((c) => c.id === id), 1);
      delete COL[id];
    }
    const anteriores = new Map((estado.planilha.contatos || []).map((c) => [c.id, assinaturaContato(c)]));
    const ate = Date.now() + 6000;
    const mudaram = anteriores.size ? conv.contatos.filter((c) => anteriores.get(c.id) !== assinaturaContato(c)) : [];
    /* Troca em massa (outra planilha, primeira carga depois de muito tempo): não pisca tudo */
    if (mudaram.length && mudaram.length <= 50) {
      mudaram.forEach((c) => estado.piscar.set(c.id, ate));
      setTimeout(() => { if (daPlanilha()) renderizarTudo(); }, 6200);
    }
    estado.planilha.contatos = conv.contatos;
    estado.planilha.abas = abas.map((a) => ({ id: a.id, nome: a.nome, ordem: a.ordem, gid: a.gid }));
    estado.planilha.cabecalhos = abas.map((a) => ({ nome: a.nome, cabecalhos: (a.cabecalhos || []).map(String) }));
    estado.planilha.recebeu = true;
    estado.planilha.copiaLocal = false;
    estado.planilha.falhou = false;
    colunasPlanilha = conv.colunas;
    const salvaEm = new Date().toISOString();
    estado.planilha.salvaEm = salvaEm;
    gravarLocal(CHAVE_PLANILHA, { versao: 1, salvaEm, sinc: sinc || null, abas: estado.planilha.abas, extras: conv.extras, colunas: conv.colunas, contatos: conv.contatos });
    aplicarPlanilha();
    verAvisoLgpdPlanilha();
  }
  function aplicarPlanilha() {
    if (!daPlanilha()) { aplicarContatosNuvem(); return; }
    if (!estado.planilha.contatos) estado.planilha.contatos = estado.contatos;
    estado.usandoReserva = false;
    estado.contatos = estado.planilha.contatos.map((c) => ({ ...c }));
    const assinatura = (colunasPlanilha || []).join("|");
    if (colunasPlanilha && estado.vista.assinaturaPlanilha !== assinatura) {
      estado.vista.colunas = [...colunasPlanilha];
      estado.vista.assinaturaPlanilha = assinatura;
      salvarVista();
    }
    estado.vista.colunas = estado.vista.colunas.filter((c) => COL[c]);
    if (!estado.vista.colunas.includes("nome")) estado.vista.colunas.unshift("nome");
    const fichaId = ficha.hidden ? null : ficha.dataset.id;
    renderizarTudo();
    atualizarBotoes();
    if (fichaId && !porId(fichaId)) fecharFicha();
  }
  function usarCopiaLocal() {
    estado.planilha.copiaLocal = !!(cachePlanilha || estado.planilha.recebeu);
    estado.planilha.falhou = !estado.planilha.copiaLocal;
    renderizarSinc();
    if (daPlanilha()) renderizarTudo();
  }
  window.addEventListener("offline", () => { if (ORIGEM_CONTATOS !== "site" && (cachePlanilha || estado.planilha.recebeu)) { estado.planilha.copiaLocal = true; renderizarSinc(); } });
  window.addEventListener("online", () => { if (estado.planilha.copiaLocal && estado.api) { estado.planilha.copiaLocal = false; renderizarSinc(); } });

  /* Firestore: escuta _estado e, para cada aba listada, o documento da aba e as partes */
  const ouvintesAbas = new Map();
  let agendado = null;
  function iniciarPlanilha(api) {
    if (ORIGEM_CONTATOS === "csv") { lerCsv(); setInterval(lerCsv, CSV_INTERVALO_MS); return; }
    if (!api) { usarCopiaLocal(); return; }
    api.ouvirDoc("planilha-contatos/_estado", (d) => {
      if (!d) {
        estado.planilha.sinc = null;
        if (!cachePlanilha && !estado.planilha.recebeu && !semSincronizacao) { semSincronizacao = true; aplicarContatosNuvem(); }
        renderizarSinc();
        return;
      }
      const sinc = {
        status: d.status === "erro" ? "erro" : "ok",
        erro: String(d.erro || "").slice(0, 300),
        planilhaId: RE_ID_PLANILHA.test(d.planilhaId || "") ? d.planilhaId : "",
        sincronizadoEm: d.sincronizadoEm || "",
        verificadoEm: d.verificadoEm || "",
        abas: (Array.isArray(d.abas) ? d.abas : []).filter((a) => a && RE_ID_ABA.test(a.id || "")).slice(0, 30)
      };
      estado.planilha.sinc = sinc;
      estado.planilha.copiaLocal = false;
      estado.planilha.falhou = false;
      if (semSincronizacao) { semSincronizacao = false; aplicarPlanilha(); }
      const ids = new Set(sinc.abas.map((a) => a.id));
      ouvintesAbas.forEach((o, id) => { if (!ids.has(id)) { o.parar.forEach((f) => f && f()); ouvintesAbas.delete(id); } });
      sinc.abas.forEach((a) => {
        if (ouvintesAbas.has(a.id)) return;
        const o = { doc: null, partes: [], parar: [] };
        ouvintesAbas.set(a.id, o);
        o.parar.push(api.ouvirDoc(`planilha-contatos/${a.id}`, (doc) => { o.doc = doc; agendarMontagem(); }, (e) => { console.warn("aba", a.id, e); usarCopiaLocal(); }));
        o.parar.push(api.ouvirColecao(`planilha-contatos/${a.id}/partes`, (lista) => { o.partes = lista; agendarMontagem(); }, (e) => { console.warn("partes", a.id, e); usarCopiaLocal(); }));
      });
      agendarMontagem();
      renderizarSinc();
    }, (erro) => { console.warn("planilha-contatos:", erro); usarCopiaLocal(); });
  }
  function agendarMontagem() {
    clearTimeout(agendado);
    agendado = setTimeout(montarAbasRecebidas, 150);
  }
  function montarAbasRecebidas() {
    const sinc = estado.planilha.sinc;
    if (!sinc) return;
    const montadas = [];
    for (const a of sinc.abas) {
      const o = ouvintesAbas.get(a.id);
      const doc = o && o.doc;
      const anterior = estado.planilha.dados.get(a.id);
      const partes = o ? o.partes.filter((p) => p.hash === (doc && doc.hash)).sort((x, y) => (x.indice || 0) - (y.indice || 0)) : [];
      const completa = doc && Array.isArray(doc.cabecalhos) && partes.length === (Number(doc.partes) || 0);
      if (!completa) {
        if (anterior) { montadas.push(anterior); continue; }
        return;
      }
      const aba = {
        id: a.id, nome: String(doc.nome || a.nome || a.id).slice(0, 100), ordem: Number(doc.ordem) || 0, gid: Number(doc.gid) || 0,
        atualizadoEm: doc.atualizadoEm || "", cabecalhos: doc.cabecalhos.slice(0, 60).map((t) => String(t).slice(0, 100)),
        linhas: partes.flatMap((p) => (Array.isArray(p.linhas) ? p.linhas : [])).filter((l) => l && Array.isArray(l.v))
      };
      estado.planilha.dados.set(a.id, aba);
      montadas.push(aba);
    }
    [...estado.planilha.dados.keys()].forEach((id) => { if (!sinc.abas.some((a) => a.id === id)) estado.planilha.dados.delete(id); });
    receberAbas(montadas.sort((x, y) => x.ordem - y.ordem), sinc);
  }

  /* Plano B: abas publicadas como CSV (sem Apps Script) */
  async function lerCsv() {
    if (!CSV_ABAS.length) { estado.planilha.erro = "nenhum link em CSV_ABAS no contatos.html"; renderizarSinc(); return; }
    try {
      const abas = await Promise.all(CSV_ABAS.map(async (x, i) => {
        if (!/^https:\/\/docs\.google\.com\/spreadsheets\/d\/e\/[\w-]+\/pub\?/.test(x.url || "")) throw new Error(`link inválido na aba ${x.nome || i + 1}`);
        const r = await fetch(x.url, { cache: "no-store" });
        if (!r.ok) throw new Error(`aba ${x.nome || i + 1}: HTTP ${r.status}`);
        const tabela = lerTabelaTexto(await r.text());
        const cab = tabela[0] || [];
        const usar = cab.map((t, j) => (String(t).trim() && !/^[#_]/.test(String(t).trim()) ? j : -1)).filter((j) => j >= 0);
        return {
          id: (slug(x.nome || `aba-${i + 1}`, 60) || `aba-${i + 1}`), nome: String(x.nome || `Aba ${i + 1}`).slice(0, 100), ordem: i,
          gid: Number((/[?&]gid=(\d+)/.exec(x.url) || [])[1]) || 0, atualizadoEm: new Date().toISOString(),
          cabecalhos: usar.map((j) => String(cab[j]).trim()),
          linhas: tabela.slice(1).map((l, k) => ({ n: k + 2, v: usar.map((j) => String(l[j] == null ? "" : l[j])) })).filter((l) => l.v.some((v) => v.trim()))
        };
      }));
      estado.planilha.erro = "";
      estado.planilha.lidoEm = new Date().toISOString();
      receberAbas(abas, { status: "ok", sincronizadoEm: estado.planilha.lidoEm, verificadoEm: estado.planilha.lidoEm });
    } catch (e) {
      console.warn("CSV da planilha:", e);
      estado.planilha.erro = String(e.message || e).slice(0, 200);
      if (!estado.planilha.recebeu) usarCopiaLocal();
      renderizarSinc();
    }
  }

  /* Faixa de sincronização (verde = em dia; amarelo = atrasada, com erro ou cópia local) */
  function linkPlanilha() {
    const id = (estado.planilha.sinc && estado.planilha.sinc.planilhaId) || PLANILHA_CONTATOS_ID;
    const aba = estado.planilha.abas.find((a) => a.id === estado.vista.aba);
    return `https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/edit${aba && aba.gid ? `#gid=${aba.gid}` : ""}`;
  }
  function renderizarSinc() {
    const faixa = $("#faixa-sinc");
    const admin = ehAdmin() && ORIGEM_CONTATOS !== "site";
    if (ORIGEM_CONTATOS === "site" || (!daPlanilha() && !admin && !semSincronizacao)) { faixa.hidden = true; faixa.dataset.chave = ""; return; }
    const p = estado.planilha;
    let texto, atrasada = false;
    if (!daPlanilha()) {
      atrasada = semSincronizacao;
      texto = semSincronizacao ? "A planilha Google ainda não foi sincronizada (o Apps Script não foi instalado). Mostrando os contatos cadastrados no site."
        : "Você está vendo os contatos cadastrados no site. Só as administradoras veem esta opção.";
    } else if (p.copiaLocal) {
      atrasada = true;
      texto = `Mostrando a última cópia salva neste navegador${p.salvaEm ? ` (de ${formatarData(p.salvaEm, true)})` : ""}.`;
    } else if (p.falhou) {
      atrasada = true;
      texto = "Sem conexão com a planilha Google e sem cópia salva neste navegador.";
    } else if (ORIGEM_CONTATOS === "csv") {
      atrasada = !!p.erro || minutosDesde(p.lidoEm) > SINC_ATRASO_MIN;
      texto = p.erro ? `Não foi possível ler a planilha publicada: ${p.erro}.` : p.lidoEm ? `Planilha Google publicada na web, lida ${haQuanto(p.lidoEm)}. Atualiza a cada minuto.` : "Lendo a planilha Google publicada…";
    } else if (!p.sinc) {
      atrasada = true;
      texto = "Conectando à planilha Google…";
    } else {
      const min = minutosDesde(p.sinc.verificadoEm);
      atrasada = p.sinc.status === "erro" || min > SINC_ATRASO_MIN;
      texto = p.sinc.status === "erro" ? `A última sincronização com a planilha falhou${p.sinc.erro ? ` (${p.sinc.erro})` : ""}. Mostrando a última versão recebida.`
        : min > SINC_ATRASO_MIN ? `Sincronização atrasada: a planilha não é conferida ${haQuanto(p.sinc.verificadoEm) || "há algum tempo"}. Mostrando a última versão recebida.`
        : `Sincronizado com a planilha Google${p.sinc.sincronizadoEm ? ` · última mudança ${haQuanto(p.sinc.sincronizadoEm)}` : ""}.`;
    }
    const origemAdmin = lerLocal(CHAVE_ORIGEM_ADMIN, "") === "site" ? "site" : "planilha";
    const chave = [texto, atrasada, admin, origemAdmin, daPlanilha(), linkPlanilha()].join("|");
    if (faixa.dataset.chave === chave) return;
    faixa.dataset.chave = chave;
    faixa.hidden = false;
    faixa.classList.toggle("atrasada", atrasada);
    faixa.innerHTML = `<span class="estado"><span class="ponto" aria-hidden="true"></span><span>${escapar(texto)}</span></span>
      <span class="acoes-sinc">
        ${daPlanilha() ? `<a class="btn btn-secundario btn-mini" href="${escapar(linkPlanilha())}" target="_blank" rel="noopener noreferrer">${svg("i-externo")}Editar na planilha Google</a>
          <button type="button" class="btn btn-secundario btn-mini" data-sinc="sugerir">${svg("i-anotacao")}Sugerir correção</button>` : ""}
        ${admin && !semSincronizacao ? `<label class="sr-only" for="origem-admin">Origem dos contatos</label>
          <select id="origem-admin" title="Origem dos contatos (só administradoras)"><option value="planilha"${origemAdmin === "planilha" ? " selected" : ""}>Origem: planilha Google</option><option value="site"${origemAdmin === "site" ? " selected" : ""}>Origem: site</option></select>` : ""}
      </span>`;
  }
  setInterval(() => { if (ORIGEM_CONTATOS !== "site") renderizarSinc(); }, 30000);
  $("#faixa-sinc").addEventListener("click", (e) => {
    if (!e.target.closest('[data-sinc="sugerir"]')) return;
    const aba = estado.planilha.abas.find((a) => a.id === estado.vista.aba);
    abrirSugestao({ titulo: "Correção na planilha de contatos", contexto: `Contatos (planilha Google)${aba ? ` · aba ${aba.nome}` : ""}`, dica: "De quem é o contato, qual dado está errado e qual é o correto? A correção é feita na planilha Google." });
  });
  $("#faixa-sinc").addEventListener("change", (e) => {
    if (e.target.id !== "origem-admin" || !ehAdmin()) return;
    gravarLocal(CHAVE_ORIGEM_ADMIN, e.target.value === "site" ? "site" : "planilha");
    estado.vista = { ...VISTA_PADRAO(), larguras: estado.vista.larguras, compacta: estado.vista.compacta, assinaturaPlanilha: estado.vista.assinaturaPlanilha };
    salvarVista();
    aplicarContatosNuvem();
    garantirExemplos();
  });

  /* LGPD: na primeira sincronização (e quando as colunas mudam) a administradora confere as colunas recebidas */
  function verAvisoLgpdPlanilha() {
    const recebidas = estado.planilha.cabecalhos;
    if (!ehAdmin() || !daPlanilha() || !recebidas || !recebidas.length || document.querySelector("dialog[open]")) return;
    const assinatura = JSON.stringify(recebidas);
    if (lerLocal(CHAVE_LGPD_PLANILHA, "") === assinatura) return;
    const suspeitas = recebidas.flatMap((a) => a.cabecalhos.filter((t) => RE_COLUNA_SUSPEITA.test(normalizar(t)) || RE_COLUNA_SUSPEITA.test(t)));
    const d = criarDialogo({
      titulo: "LGPD: colunas recebidas da planilha",
      largo: true,
      corpo: `<p class="lgpd"><strong>LGPD:</strong> a página Contatos é aberta para todo o time. A planilha deve ter só dados corporativos: nada de CPF, RG, endereço residencial, data de nascimento, celular pessoal ou dados de saúde.</p>
        <p class="apoio">Estas colunas chegaram da planilha Google${suspeitas.length ? `. <strong>Confira as marcadas em vermelho.</strong>` : "."}</p>
        ${recebidas.map((a) => `<h3 style="font-size:14px;margin:10px 0 2px">${escapar(a.nome)}</h3><ul class="colunas-recebidas">${a.cabecalhos.map((t) => `<li${suspeitas.includes(t) ? ' class="suspeita"' : ""}>${escapar(t)}</li>`).join("") || "<li>(sem colunas)</li>"}</ul>`).join("")}
        <p class="apoio">Para deixar uma coluna ou aba fora do site sem apagá-la, comece o nome dela com <code>#</code> ou <code>_</code> na planilha (ex.: <code>#CPF</code>).</p>
        <div class="form-botoes"><a class="btn btn-secundario" href="${escapar(linkPlanilha())}" target="_blank" rel="noopener noreferrer">Abrir a planilha</a><button type="submit" class="btn" value="ok">Conferi as colunas</button></div>`
    });
    d.querySelector("form").addEventListener("submit", () => {
      gravarLocal(CHAVE_LGPD_PLANILHA, assinatura);
      registrarAuditoria({ acao: "conferir", alvo: "contatos", resumo: `Conferiu as colunas da planilha de contatos (${recebidas.reduce((s, a) => s + a.cabecalhos.length, 0)} colunas)`, detalhes: recebidas.map((a) => `${a.nome}: ${a.cabecalhos.join(", ")}`).join(" | ").slice(0, 800) });
    });
    d.showModal();
  }
  window.__contatos = { estado };
</script>
</body>
</html>
